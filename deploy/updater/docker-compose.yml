# Keeps a Discagem server running the newest published image.
#
# Every few minutes it asks the registry whether the server's image tag (for example
# ghcr.io/rodriguesarrais/discagem-server:latest) points to a new image. When it does, it stops the
# server, backs up its data volume, starts the server on the new image and waits until it answers.
# If the new version does not start, the previous image is put back and the new one is skipped until
# a newer one is published. Calls and streams drop for a few seconds and reconnect on their own.
#
# Run it as its own Compose project on the machine that runs the server. Set DISCAGEM_DIR to the
# folder holding the server's Compose file (in a .env file next to this one, or in the environment):
#
#   DISCAGEM_DIR=/root/discagem/deploy docker compose up -d
#   docker compose logs -f          # what it did, and why
#
# Only the server's service is touched; a server that was stopped by hand is left alone. A server
# pinned to a version tag stays on it, and one built from source (no registry image) is not updated.
# The container controls Docker through its socket, which amounts to root access to the machine.
#
# Settings (all optional; DISCAGEM_DIR defaults to Hostinger's folder for a project named "discagem"):
#   DISCAGEM_DIR              folder of the server's Compose project
#   DISCAGEM_SERVICE          the server's service name in that project (discagem)
#   DISCAGEM_HEALTH_URL       health endpoint (http://127.0.0.1:5080/health)
#   DISCAGEM_BACKUP_DIR       where data backups go (/var/backups/discagem)
#   DISCAGEM_BACKUPS_TO_KEEP  newest backups to keep; 0 disables them (5)
#   DISCAGEM_CHECK_EVERY      seconds between checks (300)

name: discagem-updater

x-image: &image docker:28-cli

services:
  updater:
    image: *image
    restart: unless-stopped
    # Reaches the server's health endpoint on the loopback interface.
    network_mode: host
    environment:
      DISCAGEM_DIR: ${DISCAGEM_DIR:-/docker/discagem}
      SERVICE: ${DISCAGEM_SERVICE:-discagem}
      HEALTH_URL: ${DISCAGEM_HEALTH_URL:-http://127.0.0.1:5080/health}
      BACKUP_DIR: ${DISCAGEM_BACKUP_DIR:-/var/backups/discagem}
      BACKUPS_TO_KEEP: ${DISCAGEM_BACKUPS_TO_KEEP:-5}
      CHECK_EVERY: ${DISCAGEM_CHECK_EVERY:-300}
      # Runs the backups (it has tar), so they do not depend on what the server's image contains.
      HELPER_IMAGE: *image
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mounted at the same paths as on the host: Compose and the backup container resolve them there.
      - ${DISCAGEM_DIR:-/docker/discagem}:${DISCAGEM_DIR:-/docker/discagem}:ro
      - ${DISCAGEM_BACKUP_DIR:-/var/backups/discagem}:${DISCAGEM_BACKUP_DIR:-/var/backups/discagem}
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"
    # Lets an update in progress finish when the updater is stopped.
    stop_grace_period: 5m
    entrypoint: ["/bin/sh", "-c"]
    # Compose replaces $VARIABLES in this file, so the script writes $$ for each $.
    command:
      - |
        set -u
        log() { echo "$$(date -u '+%Y-%m-%d %H:%M:%S') $$*"; }
        short() { echo "$$1" | sed 's/^sha256://' | cut -c1-12; }
        skip_file="$$BACKUP_DIR/.skip-image"

        # The project as Compose started it: its name, its files ("-f path" options, split on purpose)
        # and its folder.
        compose() {
          (cd "$$DISCAGEM_DIR" && docker compose -p "$$project" $$files --project-directory "$$DISCAGEM_DIR" "$$@")
        }

        healthy() {
          i=0
          while [ "$$i" -lt 60 ]; do
            wget -q -O /dev/null -T 5 "$$HEALTH_URL" 2> /dev/null && return 0
            i=$$((i + 1))
            sleep 2
          done
          return 1
        }

        backup() {
          volume=$$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}' "$$cid")
          [ -n "$$volume" ] && [ "$$BACKUPS_TO_KEEP" -gt 0 ] || return 0
          archive="discagem-data-$$(date -u +%Y%m%d-%H%M%S).tar.gz"
          if docker run --rm --network none --entrypoint tar -v "$$volume:/data:ro" -v "$$BACKUP_DIR:/backup" \
              "$$HELPER_IMAGE" czf "/backup/$$archive" -C /data .; then
            log "Backed up volume $$volume to $$BACKUP_DIR/$$archive"
            ls -1t "$$BACKUP_DIR"/discagem-data-*.tar.gz | tail -n +"$$((BACKUPS_TO_KEEP + 1))" | xargs -r rm -f
            return 0
          fi
          rm -f "$$BACKUP_DIR/$$archive"
          return 1
        }

        update() {
          log "New image $$(short "$$new") for $$ref (running $$(short "$$old")); updating $$SERVICE"
          compose stop "$$SERVICE" || return 1
          # The server is stopped, so the database is not being written while it is copied.
          if ! backup; then
            backup_failed=$$new
            log "The backup failed; starting the current version again. Fix the cause and restart the updater to try again"
            compose start "$$SERVICE"
            return 1
          fi
          if compose up -d --no-deps --no-build --force-recreate "$$SERVICE" && healthy; then
            log "Updated: $$(wget -q -O - -T 5 "$${HEALTH_URL%/health}/" 2> /dev/null || echo "$$SERVICE answers")"
            # Drop the previous image and the one that failed before, if any (other tags keep them).
            for image in "$$rollback" "$$(cat "$$skip_file" 2> /dev/null)"; do
              [ -z "$$image" ] || docker image rm "$$image" > /dev/null 2>&1 || true
            done
            rm -f "$$skip_file"
            return 0
          fi
          log "The new version did not start. Its last log lines:"
          compose logs --no-color --tail 40 "$$SERVICE" 2>&1
          echo "$$new" > "$$skip_file"
          if [ -z "$$can_roll_back" ]; then
            log "The previous image is no longer available, so $$SERVICE stays on $$(short "$$new"); the data backups are in $$BACKUP_DIR"
            return 1
          fi
          log "Going back to $$(short "$$old"); $$(short "$$new") is skipped until a newer image is published"
          docker tag "$$rollback" "$$ref"
          if compose up -d --no-deps --no-build --force-recreate "$$SERVICE" && healthy; then
            log "The previous version is running again"
          else
            log "The previous version did not start either; the data backups are in $$BACKUP_DIR"
          fi
          return 1
        }

        check() {
          cid=$$(docker ps -q --filter "label=com.docker.compose.project.working_dir=$$DISCAGEM_DIR" \
            --filter "label=com.docker.compose.service=$$SERVICE" | head -n 1)
          if [ -z "$$cid" ]; then
            [ "$$state" = idle ] || log "No running $$SERVICE container from the project in $$DISCAGEM_DIR; waiting for one"
            state=idle
            return 0
          fi
          project=$$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$$cid")
          files=$$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project.config_files"}}' "$$cid" |
            tr ',' '\n' | sed '/^$$/d; s/^/-f /' | tr '\n' ' ')
          ref=$$(docker inspect -f '{{.Config.Image}}' "$$cid")
          old=$$(docker inspect -f '{{.Image}}' "$$cid")
          if [ "$$state" != "$$cid" ]; then
            log "Watching $$ref ($$(short "$$old")), service $$SERVICE of project $$project"
            state=$$cid
          fi

          # Pulling moves the tag (and, with the containerd image store, forgets the image it left), so
          # keep the running image under a local tag first, to back up from and to go back to.
          repo=$$ref
          case "$${ref##*/}" in *:*) repo=$${ref%:*} ;; esac
          rollback="$$repo:updater-rollback"
          can_roll_back=
          docker tag "$$old" "$$rollback" 2> /dev/null && can_roll_back=1

          if ! error=$$(docker pull -q "$$ref" 2>&1); then
            [ "$$pull_failed" = "$$ref" ] || log "Cannot check $$ref for updates: $$error"
            pull_failed=$$ref
            return 0
          fi
          pull_failed=
          new=$$(docker image inspect -f '{{.Id}}' "$$ref")
          [ "$$new" != "$$old" ] || return 0
          [ "$$new" != "$$(cat "$$skip_file" 2> /dev/null)" ] || return 0
          [ "$$new" != "$$backup_failed" ] || return 0
          update
        }

        state=
        pull_failed=
        backup_failed=
        busy=
        stopping=
        trap 'stopping=1; [ -n "$$busy" ] || exit 0' TERM INT
        mkdir -p "$$BACKUP_DIR"
        log "Checking the $$SERVICE service in $$DISCAGEM_DIR every $$CHECK_EVERY seconds"
        while :; do
          busy=1
          check
          busy=
          [ -z "$$stopping" ] || exit 0
          sleep "$$CHECK_EVERY" &
          wait $$!
        done
