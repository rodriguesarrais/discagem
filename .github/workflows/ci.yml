name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install libvpx
        run: sudo apt-get update && sudo apt-get install -y libvpx9

      - name: Build
        run: dotnet build Discagem.slnx -c Release

      - name: Test
        run: dotnet test Discagem.slnx -c Release --no-build --logger "console;verbosity=normal"

  windows-client:
    name: Windows client
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/Discagem.Client -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out/Discagem-win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: Discagem-win-x64
          path: out/Discagem-win-x64

  server-image:
    name: Server image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f deploy/Dockerfile -t discagem-server:ci .
