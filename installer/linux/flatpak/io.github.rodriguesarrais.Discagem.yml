# Flatpak of the Discagem desktop client. installer/linux/build.sh publishes the client
# (self-contained, so no .NET runtime is needed) and places it next to a copy of this file, in app/,
# with the desktop entry, metadata and icons in share/.
id: io.github.rodriguesarrais.Discagem
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: discagem
finish-args:
  - --share=network
  - --share=ipc
  # The interface uses X11 (XWayland on Wayland desktops); screen sharing captures X11 screens and windows.
  - --socket=x11
  - --device=dri
  # Voice, the sound of streams, and capturing what other applications play when sharing a screen.
  - --socket=pulseaudio
  # The icon in the notification area (StatusNotifierItem).
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-2-0
modules:
  - name: discagem
    buildsystem: simple
    build-options:
      # Prebuilt .NET and Skia libraries: keep them as they are.
      no-debuginfo: true
      strip: false
    sources:
      - type: dir
        path: .
    build-commands:
      - mkdir -p /app/lib /app/bin
      - cp -a app /app/lib/discagem
      - ln -s ../lib/discagem/Discagem /app/bin/discagem
      - cp -a share/. /app/share/
